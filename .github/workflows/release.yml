name: Release to PyPI & GitHub

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build dist & verify wheel in clean venv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Smoke-test built wheel & generate sample HTML waterfall
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/inferdiff --help > /dev/null
          set +e
          /tmp/smoke-venv/bin/inferdiff diff \
            examples/case1_responses_truncated_tool/baseline.trace.jsonl \
            examples/case1_responses_truncated_tool/target.trace.jsonl \
            --html dist/case1-waterfall.html --no-color
          rc=$?
          set -e
          test "$rc" -eq 2
          test -s dist/case1-waterfall.html

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  publish-pypi:
    name: Publish to PyPI via Trusted Publisher (OIDC)
    needs: build-and-smoke
    # Runs on manual workflow_dispatch (select tag e.g. v0.1.0), or automatically on tag pushes
    # once repository variable ENABLE_PYPI_PUBLISH=true is set after PyPI Pending Publisher setup.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/inferdiff
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Remove non-PyPI sample HTML before upload
        run: rm -f dist/*.html

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Attach artifacts to GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions and sample HTML
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Not a tag ref (${GITHUB_REF_NAME}); skipping GitHub Release attachment."
            exit 0
          fi
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "inferdiff ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
