[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inferdiff"
version = "0.1.1"
description = "Wireshark for streaming LLMs: catch HTTP 200 silent truncations, broken tool JSON, fake SSE relays & usage drops."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []
authors = [
    { name = "ApacheWang" },
]
keywords = ["llm", "inference", "sse", "streaming", "vllm", "llama-cpp", "sglang", "ollama", "litellm", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
httpx = ["httpx>=0.27"]
dev = ["pytest>=8.0"]

[project.scripts]
inferdiff = "inferdiff.cli:main"

[project.urls]
Homepage = "https://github.com/ApacheWang/inferdiff"
Repository = "https://github.com/ApacheWang/inferdiff"
Issues = "https://github.com/ApacheWang/inferdiff/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
